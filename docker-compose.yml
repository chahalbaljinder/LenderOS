services:
  postgres:
    image: postgres:16-alpine
    container_name: lenderos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lenderos
      POSTGRES_PASSWORD: lenderos
      POSTGRES_DB: lenderos
    volumes:
      - lenderos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenderos -d lenderos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lenderos_pg_data:
