openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LendingOS — Multi-Tenant AI Lending Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tenants
    description: Tenant management
  - name: users
    description: User management
  - name: customers
    description: Customer management
  - name: loan-products
    description: Loan product catalog
  - name: loan-applications
    description: Loan application lifecycle
  - name: kyc
    description: KYC verification
  - name: risk
    description: Risk engine and AI scoring
  - name: offers
    description: Loan offer engine
  - name: loans
    description: Active loan management
  - name: repayments
    description: EMI and repayment tracking
  - name: collections
    description: Collections management
  - name: analytics
    description: Analytics and dashboards
  - name: audit
    description: Audit logs
  - name: settings
    description: Platform settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── TENANTS ────────────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, pending, suspended, inactive]
        - name: type
          in: query
          schema:
            type: string
            enum: [nbfc, bank, lsp, fintech]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get tenant by ID
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /tenants/{tenantId}/approve:
    post:
      operationId: approveTenant
      tags: [tenants]
      summary: Approve a pending tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tenant approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{tenantId}/stats:
    get:
      operationId: getTenantStats
      tags: [tenants]
      summary: Get tenant dashboard statistics
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tenant stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStats"

  # ─── USERS ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (scoped to tenant for tenant admins)
      parameters:
        - name: tenantId
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── CUSTOMERS ──────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers for the tenant
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, blacklisted] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{customerId}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{customerId}/credit-report:
    get:
      operationId: getCustomerCreditReport
      tags: [customers]
      summary: Get customer credit bureau report
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditReport"

  # ─── LOAN PRODUCTS ──────────────────────────────────────────────────────────
  /loan-products:
    get:
      operationId: listLoanProducts
      tags: [loan-products]
      summary: List loan products
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [personal, business, msme, education, medical, home, gold, vehicle, salary_advance, bnpl, credit_line]
        - name: active
          in: query
          schema: { type: boolean }
        - name: tenantId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Loan products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanProduct"
    post:
      operationId: createLoanProduct
      tags: [loan-products]
      summary: Create loan product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanProduct"

  /loan-products/{productId}:
    get:
      operationId: getLoanProduct
      tags: [loan-products]
      summary: Get loan product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Loan product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanProduct"
    patch:
      operationId: updateLoanProduct
      tags: [loan-products]
      summary: Update loan product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanProduct"

  # ─── LOAN APPLICATIONS ──────────────────────────────────────────────────────
  /loan-applications:
    get:
      operationId: listLoanApplications
      tags: [loan-applications]
      summary: List loan applications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, under_review, kyc_pending, kyc_verified, risk_assessment, offer_generated, offer_accepted, esign_pending, approved, disbursed, rejected, withdrawn]
        - name: customerId
          in: query
          schema: { type: string }
        - name: tenantId
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationListResponse"
    post:
      operationId: createLoanApplication
      tags: [loan-applications]
      summary: Create loan application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"

  /loan-applications/{applicationId}:
    get:
      operationId: getLoanApplication
      tags: [loan-applications]
      summary: Get loan application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"
    patch:
      operationId: updateLoanApplication
      tags: [loan-applications]
      summary: Update loan application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"

  /loan-applications/{applicationId}/submit:
    post:
      operationId: submitLoanApplication
      tags: [loan-applications]
      summary: Submit application for review
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"

  /loan-applications/{applicationId}/approve:
    post:
      operationId: approveLoanApplication
      tags: [loan-applications]
      summary: Approve loan application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationApprovalInput"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"

  /loan-applications/{applicationId}/reject:
    post:
      operationId: rejectLoanApplication
      tags: [loan-applications]
      summary: Reject loan application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationRejectionInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"

  /loan-applications/{applicationId}/disburse:
    post:
      operationId: disburseLoan
      tags: [loan-applications]
      summary: Trigger disbursement
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisbursementInput"
      responses:
        "200":
          description: Disbursed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"

  # ─── KYC ────────────────────────────────────────────────────────────────────
  /kyc/{applicationId}:
    get:
      operationId: getKycStatus
      tags: [kyc]
      summary: Get KYC status for an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: KYC status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"

  /kyc/{applicationId}/pan:
    post:
      operationId: submitPanVerification
      tags: [kyc]
      summary: Submit PAN verification
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanVerificationInput"
      responses:
        "200":
          description: PAN verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"

  /kyc/{applicationId}/aadhaar:
    post:
      operationId: submitAadhaarVerification
      tags: [kyc]
      summary: Submit Aadhaar verification
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AadhaarVerificationInput"
      responses:
        "200":
          description: Aadhaar verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"

  /kyc/{applicationId}/face:
    post:
      operationId: submitFaceVerification
      tags: [kyc]
      summary: Submit face verification / liveness check
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceVerificationInput"
      responses:
        "200":
          description: Face verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"

  /kyc/{applicationId}/employment:
    post:
      operationId: submitEmploymentVerification
      tags: [kyc]
      summary: Submit employment/income verification
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmploymentVerificationInput"
      responses:
        "200":
          description: Employment verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"

  # ─── RISK ENGINE ────────────────────────────────────────────────────────────
  /risk/{applicationId}/score:
    get:
      operationId: getRiskScore
      tags: [risk]
      summary: Get AI risk score for an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Risk score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScore"

  /risk/{applicationId}/analyze:
    post:
      operationId: analyzeRisk
      tags: [risk]
      summary: Trigger AI risk analysis
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Risk analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScore"

  /risk/{applicationId}/fraud:
    get:
      operationId: getFraudFlags
      tags: [risk]
      summary: Get fraud detection flags
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Fraud flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudFlags"

  # ─── OFFERS ─────────────────────────────────────────────────────────────────
  /offers/{applicationId}:
    get:
      operationId: getOffers
      tags: [offers]
      summary: Get loan offers for application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Loan offers from multiple NBFCs/Banks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanOffer"

  /offers/{applicationId}/accept:
    post:
      operationId: acceptOffer
      tags: [offers]
      summary: Accept a loan offer
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferAcceptanceInput"
      responses:
        "200":
          description: Offer accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"

  /offers/calculate-emi:
    post:
      operationId: calculateEmi
      tags: [offers]
      summary: Calculate EMI for loan parameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmiCalculationInput"
      responses:
        "200":
          description: EMI calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmiCalculation"

  # ─── LOANS ──────────────────────────────────────────────────────────────────
  /loans:
    get:
      operationId: listLoans
      tags: [loans]
      summary: List active loans
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, closed, npa, written_off]
        - name: customerId
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanListResponse"

  /loans/{loanId}:
    get:
      operationId: getLoan
      tags: [loans]
      summary: Get loan details
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /loans/{loanId}/schedule:
    get:
      operationId: getLoanSchedule
      tags: [loans]
      summary: Get loan repayment schedule
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Repayment schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepaymentScheduleItem"

  # ─── REPAYMENTS ─────────────────────────────────────────────────────────────
  /repayments:
    get:
      operationId: listRepayments
      tags: [repayments]
      summary: List repayments
      parameters:
        - name: loanId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, overdue, partial]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Repayments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentListResponse"

  /repayments/{repaymentId}/record:
    post:
      operationId: recordRepayment
      tags: [repayments]
      summary: Record a repayment
      parameters:
        - name: repaymentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentRecordInput"
      responses:
        "200":
          description: Repayment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repayment"

  # ─── COLLECTIONS ────────────────────────────────────────────────────────────
  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List collection cases
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, in_progress, resolved, escalated]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Collection cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionListResponse"

  /collections/{collectionId}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get collection case
      parameters:
