components:
  schemas:
    HealthStatus:
      type: object
      required: [status, api, database, uptime, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Overall health status
        api:
          type: string
          enum: [ok, degraded, down]
          description: API service status
        database:
          type: string
          enum: [ok, degraded, down]
          description: Database connectivity status
        uptime:
          type: number
          description: Server uptime in seconds
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp (ISO 8601)
        version:
          type: string
          description: API version

    # ── TENANTS ────────────────────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, type, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [nbfc, bank, lsp, fintech]
        status:
          type: string
          enum: [active, pending, suspended, inactive]
        domain: { type: ["string", "null"] }
        logo: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        contactEmail: { type: string }
        contactPhone: { type: ["string", "null"] }
        licenseNumber: { type: ["string", "null"] }
        totalLoans: { type: integer }
        totalCustomers: { type: integer }
        totalDisbursed: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }

    TenantInput:
      type: object
      required: [name, type, contactEmail]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [nbfc, bank, lsp, fintech]
        contactEmail: { type: string }
        contactPhone: { type: string }
        domain: { type: string }
        logo: { type: string }
        primaryColor: { type: string }
        licenseNumber: { type: string }

    TenantUpdate:
      type: object
      properties:
        name: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        domain: { type: string }
        logo: { type: string }
        primaryColor: { type: string }
        status:
          type: string
          enum: [active, pending, suspended, inactive]
        licenseNumber: { type: string }

    TenantListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    TenantStats:
      type: object
      required: [totalApplications, totalLoans, totalDisbursed, totalCollections, activeCustomers, defaultRate, approvalRate]
      properties:
        totalApplications: { type: integer }
        totalLoans: { type: integer }
        totalDisbursed: { type: number }
        totalCollections: { type: number }
        activeCustomers: { type: integer }
        defaultRate: { type: number }
        approvalRate: { type: number }
        pendingApplications: { type: integer }
        overdueLoans: { type: integer }

    TenantSettings:
      type: object
      required: [tenantId]
      properties:
        tenantId: { type: string }
        primaryColor: { type: ["string", "null"] }
        secondaryColor: { type: ["string", "null"] }
        logo: { type: ["string", "null"] }
        favicon: { type: ["string", "null"] }
        domain: { type: ["string", "null"] }
        emailFromName: { type: ["string", "null"] }
        emailFromAddress: { type: ["string", "null"] }
        smsProvider: { type: ["string", "null"] }
        whatsappEnabled: { type: boolean }
        autoApprovalEnabled: { type: boolean }
        maxLoanAmount: { type: ["number", "null"] }
        minCreditScore: { type: ["integer", "null"] }

    TenantSettingsUpdate:
      type: object
      properties:
        primaryColor: { type: string }
        secondaryColor: { type: string }
        logo: { type: string }
        favicon: { type: string }
        domain: { type: string }
        emailFromName: { type: string }
        emailFromAddress: { type: string }
        smsProvider: { type: string }
        whatsappEnabled: { type: boolean }
        autoApprovalEnabled: { type: boolean }
        maxLoanAmount: { type: number }
        minCreditScore: { type: integer }

    # ── USERS ──────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id: { type: string }
        clerkId: { type: ["string", "null"] }
        email: { type: string }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        role:
          type: string
          enum: [super_admin, platform_admin, tenant_owner, tenant_admin, risk_manager, loan_manager, collection_manager, customer_support, sales_agent, dsa, relationship_manager, customer, auditor, compliance_officer]
        tenantId: { type: ["string", "null"] }
        tenantName: { type: ["string", "null"] }
        isActive: { type: boolean }
        lastLoginAt: { type: ["string", "null"] }
        createdAt: { type: string }

    UserInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [tenant_owner, tenant_admin, risk_manager, loan_manager, collection_manager, customer_support, sales_agent, dsa, relationship_manager, customer, auditor, compliance_officer]
        tenantId: { type: string }

    UserUpdate:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        role: { type: string }
        isActive: { type: boolean }

    UserProfileUpdate:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }

    UserListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    # ── CUSTOMERS ─────────────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, firstName, lastName, email, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        dateOfBirth: { type: ["string", "null"] }
        gender: { type: ["string", "null"] }
        panNumber: { type: ["string", "null"] }
        aadhaarNumber: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        pincode: { type: ["string", "null"] }
        employmentType:
          type: ["string", "null"]
          enum: [salaried, self_employed, business, student, retired, null]
        monthlyIncome: { type: ["number", "null"] }
        creditScore: { type: ["integer", "null"] }
        kycStatus:
          type: string
          enum: [pending, partial, verified, rejected]
        status:
          type: string
          enum: [active, inactive, blacklisted]
        totalLoans: { type: integer }
        activeLoans: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    CustomerInput:
      type: object
      required: [firstName, lastName, email, phone]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        dateOfBirth: { type: string }
        gender: { type: string }
        panNumber: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        employmentType: { type: string }
        monthlyIncome: { type: number }

    CustomerUpdate:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        dateOfBirth: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        employmentType: { type: string }
        monthlyIncome: { type: number }
        status: { type: string }

    CustomerListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    CreditReport:
      type: object
      required: [customerId, creditScore, bureau]
      properties:
        customerId: { type: string }
        creditScore: { type: integer }
        bureau: { type: string }
        totalAccounts: { type: integer }
        activeAccounts: { type: integer }
        closedAccounts: { type: integer }
        totalOutstanding: { type: number }
        overdueAmount: { type: number }
        paymentHistory: { type: string }
        inquiries30Days: { type: integer }
        reportDate: { type: string }

    # ── LOAN PRODUCTS ─────────────────────────────────────────────────────────
    LoanProduct:
      type: object
      required: [id, tenantId, name, type, minAmount, maxAmount, minTenureMonths, maxTenureMonths, interestRate, isActive, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        type:
          type: string
          enum: [personal, business, msme, education, medical, home, gold, vehicle, salary_advance, bnpl, credit_line]
        minAmount: { type: number }
        maxAmount: { type: number }
        minTenureMonths: { type: integer }
        maxTenureMonths: { type: integer }
        interestRate: { type: number }
        processingFeePercent: { type: number }
        prepaymentPenaltyPercent: { type: number }
        isActive: { type: boolean }
        requiredDocuments:
          type: array
          items: { type: string }
        eligibilityCriteria: { type: ["string", "null"] }
        createdAt: { type: string }

    LoanProductInput:
      type: object
      required: [name, type, minAmount, maxAmount, minTenureMonths, maxTenureMonths, interestRate]
      properties:
        name: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [personal, business, msme, education, medical, home, gold, vehicle, salary_advance, bnpl, credit_line]
        minAmount: { type: number }
        maxAmount: { type: number }
        minTenureMonths: { type: integer }
        maxTenureMonths: { type: integer }
        interestRate: { type: number }
        processingFeePercent: { type: number }
        prepaymentPenaltyPercent: { type: number }
        isActive: { type: boolean }
        requiredDocuments:
          type: array
          items: { type: string }
        eligibilityCriteria: { type: string }

    LoanProductUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        minAmount: { type: number }
        maxAmount: { type: number }
        interestRate: { type: number }
        processingFeePercent: { type: number }
        isActive: { type: boolean }

    # ── LOAN APPLICATIONS ─────────────────────────────────────────────────────
    LoanApplication:
      type: object
      required: [id, customerId, tenantId, productId, requestedAmount, requestedTenure, purpose, status, createdAt]
      properties:
        id: { type: string }
        applicationNumber: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        tenantId: { type: string }
        tenantName: { type: string }
        productId: { type: string }
        productName: { type: string }
        requestedAmount: { type: number }
        requestedTenure: { type: integer }
        purpose: { type: string }
        status:
          type: string
          enum: [draft, submitted, under_review, kyc_pending, kyc_verified, risk_assessment, offer_generated, offer_accepted, esign_pending, approved, disbursed, rejected, withdrawn]
        riskScore: { type: ["number", "null"] }
        riskGrade: { type: ["string", "null"] }
        approvedAmount: { type: ["number", "null"] }
        approvedTenure: { type: ["integer", "null"] }
        approvedRate: { type: ["number", "null"] }
        rejectionReason: { type: ["string", "null"] }
        disbursedAt: { type: ["string", "null"] }
        bankAccount: { type: ["string", "null"] }
        ifscCode: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    LoanApplicationInput:
      type: object
      required: [customerId, productId, requestedAmount, requestedTenure, purpose]
      properties:
        customerId: { type: string }
        productId: { type: string }
        requestedAmount: { type: number }
        requestedTenure: { type: integer }
        purpose: { type: string }
        bankAccount: { type: string }
        ifscCode: { type: string }

    LoanApplicationUpdate:
      type: object
      properties:
        requestedAmount: { type: number }
        requestedTenure: { type: integer }
        purpose: { type: string }
        bankAccount: { type: string }
        ifscCode: { type: string }

    LoanApplicationListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LoanApplication"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    ApplicationApprovalInput:
      type: object
      required: [approvedAmount, approvedTenure, approvedRate]
      properties:
        approvedAmount: { type: number }
        approvedTenure: { type: integer }
        approvedRate: { type: number }
        notes: { type: string }

    ApplicationRejectionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    DisbursementInput:
      type: object
      required: [bankAccount, ifscCode]
      properties:
        bankAccount: { type: string }
        ifscCode: { type: string }
        disbursementMode: { type: string, enum: [neft, imps, upi] }
        notes: { type: string }

    # ── KYC ───────────────────────────────────────────────────────────────────
    KycStatus:
      type: object
      required: [applicationId, overallStatus]
      properties:
        applicationId: { type: string }
        overallStatus:
          type: string
          enum: [pending, partial, verified, rejected]
        panStatus: { type: string, enum: [pending, verified, failed] }
        aadhaarStatus: { type: string, enum: [pending, verified, failed] }
        faceStatus: { type: string, enum: [pending, verified, failed] }
        employmentStatus: { type: string, enum: [pending, verified, failed] }
        panNumber: { type: ["string", "null"] }
        aadhaarNumber: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"] }

    PanVerificationInput:
      type: object
      required: [panNumber, dateOfBirth, name]
      properties:
        panNumber: { type: string }
        dateOfBirth: { type: string }
        name: { type: string }

    AadhaarVerificationInput:
      type: object
      required: [aadhaarNumber]
      properties:
        aadhaarNumber: { type: string }
        otp: { type: string }

    FaceVerificationInput:
      type: object
      required: [imageBase64]
      properties:
        imageBase64: { type: string }

    EmploymentVerificationInput:
      type: object
      required: [employmentType, employerName, monthlyIncome]
      properties:
        employmentType: { type: string }
        employerName: { type: string }
        monthlyIncome: { type: number }
        designation: { type: string }
        employmentStartDate: { type: string }

    # ── RISK ──────────────────────────────────────────────────────────────────
    RiskScore:
      type: object
      required: [applicationId, score, grade, recommendation]
      properties:
        applicationId: { type: string }
        score: { type: number }
        grade:
          type: string
          enum: [A1, A2, B1, B2, C1, C2, D, E]
        recommendation:
          type: string
          enum: [approve, approve_with_conditions, review, reject]
        creditScoreWeight: { type: number }
        incomeWeight: { type: number }
        debtToIncomeRatio: { type: number }
        employmentStabilityScore: { type: number }
        fraudRiskScore: { type: number }
        explanation: { type: string }
        computedAt: { type: string }

    FraudFlags:
      type: object
      required: [applicationId, isFraudulent, riskLevel]
      properties:
        applicationId: { type: string }
        isFraudulent: { type: boolean }
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        flags:
          type: array
          items:
            type: object
            required: [type, description, severity]
            properties:
              type: { type: string }
              description: { type: string }
              severity:
                type: string
                enum: [low, medium, high]
        checkedAt: { type: string }

    # ── OFFERS ────────────────────────────────────────────────────────────────
    LoanOffer:
      type: object
      required: [id, applicationId, tenantId, tenantName, offeredAmount, tenure, interestRate, emi, processingFee, expiresAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        tenantId: { type: string }
        tenantName: { type: string }
        tenantLogo: { type: ["string", "null"] }
        offeredAmount: { type: number }
        tenure: { type: integer }
        interestRate: { type: number }
        emi: { type: number }
        processingFee: { type: number }
        totalInterest: { type: number }
        totalRepayable: { type: number }
        approvalProbability: { type: number }
        disbursementTime: { type: string }
        expiresAt: { type: string }
        isAccepted: { type: boolean }

    OfferAcceptanceInput:
      type: object
      required: [offerId]
      properties:
        offerId: { type: string }

    EmiCalculationInput:
      type: object
      required: [principal, annualRate, tenureMonths]
      properties:
        principal: { type: number }
        annualRate: { type: number }
        tenureMonths: { type: integer }

    EmiCalculation:
      type: object
      required: [emi, totalPayable, totalInterest, processingFee]
      properties:
        emi: { type: number }
        totalPayable: { type: number }
        totalInterest: { type: number }
        processingFee: { type: number }
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/RepaymentScheduleItem"

    # ── LOANS ─────────────────────────────────────────────────────────────────
    Loan:
      type: object
      required: [id, applicationId, customerId, tenantId, principalAmount, outstandingAmount, interestRate, tenure, emiAmount, status, disbursedAt]
      properties:
        id: { type: string }
        loanNumber: { type: string }
        applicationId: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        tenantId: { type: string }
        principalAmount: { type: number }
        outstandingAmount: { type: number }
        totalPaid: { type: number }
        interestRate: { type: number }
        tenure: { type: integer }
        emiAmount: { type: number }
